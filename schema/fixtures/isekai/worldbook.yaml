      "key": "ashen_wastes",
      "title": "世界第一·灰烬荒原",
      "content": "核冬天后的废土。极寒、辐射尘、游荡的拾荒者部族。物资极度匮乏，野外生存与地质判读（寻找避难所与水源）是核心能力。停留回合由隐藏骰程决定。"
    },
    {
      "key": "cyber_hive",
      "title": "世界第二·赛博巢都",
      "content": "垂直巨构都市，义体黑市与企业武装共治。高科技环境对技术流 Build 有利；急诊医学在帮派火并中同样抢手。信息即货币。"
    },
    {
      "key": "arcane_court",
      "title": "世界第三·奥术宫廷",
      "content": "魔法贵族的阴谋场。物理技能贬值，心理韧性与锚点（不被言灵蛊惑）决定生死。SAN 系统在此接受最严峻考验。"
    }
