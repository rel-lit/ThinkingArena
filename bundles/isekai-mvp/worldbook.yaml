    {
      "key": "fungal_forest",
      "title": "世界第一 · 菌冠林海",
      "content": "被遮天菌冠覆盖的原始森林世界。巨型菌柄撑起百米高的菌盖，阳光只能以幽绿光斑的形式漏到林床。这里没有金属矿脉、没有电力、没有任何文字文明的残骸——技术流 Build 在此近似白板；野外生存、医疗处置与心理韧性直接生效。昼夜以菌盖的收张为节律，夜间的林床伸手不见五指。"
    },
    {
      "key": "spore_miasma",
      "title": "孢子瘴气（认知危害）",
      "content": "菌冠定时喷吐的致幻孢子随气流贴着林床移动，肉眼可见如淡金色薄雾。吸入者先闻到不存在的气味，再听见菌林深处的「集体低语」——仿佛有人唤你的名字、复述你的记忆。这是本世界最主要的 SAN 压力源：长期暴露且无精神锚点支撑者会逐渐把低语当作真实（认知冲击）。心理韧性训练与仪式性习惯可以抵抗。"
    },
    {
      "key": "survival_pressures",
      "title": "生存压力",
      "content": "昼夜温差超过 30 度；夜间毒虫群循体温聚集，需以特定菌灰涂抹皮肤驱赶。可食性与水源判读是每日课题：发光菌多数剧毒，但岩层渗水痕迹与蕨类分布可以指示安全水源（地质判读有用）。林床没有大型猛兽，真正的威胁是缓慢而不可谈判的：失温、脱水、感染、瘴气。"
    },
    {
      "key": "crossing_omen",
      "title": "穿越征兆（传说）",
      "content": "被丢进这个世界的受试者不知道停留机制：世界边缘偶尔会出现「褪色带」——菌落成片变成灰白、低语完全静默的区域，似乎是下一次穿越的前兆。停留多久、去往何处，不由主角决定。"
    }
  ]
